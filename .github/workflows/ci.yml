# Hosted CI: offline tests and synthetic demo, plus lint, typing and package builds.
# No real transport or provider credentials are used by the test suite.
name: ci
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install -e ".[dev]"
      - run: ruff check .
      - run: ruff format --check .
      - run: pyright
      - run: pytest
      - run: python -m durable_outbox.demo
      - run: python -m build
      - run: python scripts/wheel_smoke.py dist/*.whl
